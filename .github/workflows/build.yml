name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test (no TV, no browsers, no network)
        run: swift test
      - name: Universal release build
        run: swift build -c release --arch arm64 --arch x86_64
